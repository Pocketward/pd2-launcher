# The mirror of the built-in FEX's files. The launcher downloads each file its
# built-in FEX uses (FEX's packages for arm64 and FEX's Ubuntu RootFS) from a
# release of this repository first, and from the file's upstream sources only
# when the mirror does not give it; FEX's Launchpad PPA removes a superseded
# version's files some days after the next release.
#
# This workflow reads the pins from src/builtin_fex_pins.json (the release tag,
# and each file's name, size, SHA-256 and upstream sources), downloads each
# file the release does not hold yet from its upstream sources, checks its size
# and SHA-256, and uploads it unchanged. A file the release already holds must
# have the pinned size and SHA-256; it is never replaced. The release is
# published (not a draft and not the latest release), so anyone can download
# from it, and every file is then downloaded from it once more and checked.
# A run whose mirror is complete changes nothing.
#
# The release workflow calls it before it builds a release; it can also run by
# itself (gh workflow run mirror-fex.yml).
name: Mirror FEX

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: mirror-fex
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill and check the mirror release
        env:
          GH_TOKEN: ${{ github.token }}
          PINS: src/builtin_fex_pins.json
        run: |
          set -euo pipefail
          [[ $(jq -r .schema "$PINS") == 1 ]] || { echo "::error::unknown schema of $PINS"; exit 1; }
          repository=$(jq -r .mirror.repository "$PINS")
          tag=$(jq -r .mirror.tag "$PINS")
          version=$(jq -r .fex_version "$PINS")
          [[ $repository == "$GITHUB_REPOSITORY" ]] ||
            { echo "::error::the pins name the mirror $repository, not this repository"; exit 1; }
          [[ $tag == "fex-$version" ]] || { echo "::error::the mirror tag $tag is not fex-$version"; exit 1; }
          work=$(mktemp -d)

          # Whether a downloaded file has the pinned size and SHA-256.
          matches() {
            [[ $(stat -c %s "$1") == "$2" ]] && [[ $(sha256sum "$1" | cut -d' ' -f1) == "$3" ]]
          }

          # The release, made as a draft until every file is on it.
          if ! release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>&1); then
            [[ $release == "release not found" ]] || { echo "::error::cannot read the release $tag: $release"; exit 1; }
            notes="FEX-Emu $version packages for arm64 and the RootFS that PD2 Launcher's built-in FEX uses, unchanged from their upstream sources:"
            while IFS=$'\t' read -r name size sha256 upstream; do
              notes+=$'\n'"- \`$name\`: $size bytes, SHA-256 \`$sha256\`, from $upstream"
            done < <(jq -r '.files[] | [.name, .size, .sha256, .upstream[0]] | @tsv' "$PINS")
            default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
              --target "$default_branch" --title "FEX-Emu $version for the built-in FEX" --notes "$notes"
            release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)
          fi

          # Nothing on the release that the pins do not name.
          unpinned=$(jq -r --slurpfile pins "$PINS" \
            '[.assets[].name] - [$pins[0].files[].name] | .[]' <<<"$release")
          [[ -z $unpinned ]] || { echo "::error::the release $tag holds files the pins do not name: $unpinned"; exit 1; }

          while IFS=$'\t' read -r name size sha256; do
            mkdir "$work/$name.d"
            file="$work/$name.d/$name"
            if jq -e --arg name "$name" 'any(.assets[]; .name == $name)' <<<"$release" >/dev/null; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$work/$name.d"
              matches "$file" "$size" "$sha256" ||
                { echo "::error::$name on the release is not the pinned file; it is not replaced"; exit 1; }
              echo "$name: on the release, pinned size and SHA-256"
              continue
            fi
            fetched=
            while read -r url; do
              if curl -fsSL --retry 3 --max-filesize "$size" -o "$file" "$url" && matches "$file" "$size" "$sha256"; then
                fetched=$url
                break
              fi
              echo "$name: $url did not give the pinned file"
              rm -f "$file"
            done < <(jq -r --arg name "$name" '.files[] | select(.name == $name) | .upstream[]' "$PINS")
            [[ -n $fetched ]] || { echo "::error::no upstream source gave the pinned $name"; exit 1; }
            # No --clobber: a file of that name that appeared meanwhile is never replaced.
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            echo "$name: uploaded from $fetched"
          done < <(jq -r '.files[] | [.name, .size, .sha256] | @tsv' "$PINS")

          if [[ $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) == true ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi

          # Every file as a player gets it: without a login, from the release's public link.
          while IFS=$'\t' read -r name size sha256; do
            rm -f "$work/check"
            curl -fsSL --retry 3 --max-filesize "$size" -o "$work/check" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
            matches "$work/check" "$size" "$sha256" ||
              { echo "::error::$name as downloaded from the release is not the pinned file"; exit 1; }
            echo "$name: downloaded from the release, $size bytes, SHA-256 $sha256"
          done < <(jq -r '.files[] | [.name, .size, .sha256] | @tsv' "$PINS")
