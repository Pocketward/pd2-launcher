# Checks of every push to main and every pull request: formatting, Clippy
# without warnings and the unit tests, for the default (dev) build and with all
# features (the release build and the x86-64 host row).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the build libraries GPUI needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libasound2-dev libfontconfig-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev pkg-config

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt

      - name: Restore the Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy, all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Clippy, default features
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests, all features
        run: cargo test --locked --all-targets --all-features

      - name: Tests, default features
        run: cargo test --locked --all-targets
